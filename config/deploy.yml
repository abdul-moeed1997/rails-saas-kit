<% require_relative "../lib/kamal/credentials_loader"
   kamal = Kamal::CredentialsLoader.load
   servers = kamal.fetch(:servers)
   registry = kamal.fetch(:registry, {})
%>
# Kamal deployment — server IPs and deploy targets are loaded from
# config/credentials/production.yml.enc under the `kamal:` key.
#
# Edit credentials:
#   EDITOR="vim" bin/rails credentials:edit --environment production
#
# Expected structure:
#   kamal:
#     image: your-user/rails_saas_kit
#     servers:
#       web:
#         - 1.2.3.4
#       job:                       # optional — omit when SOLID_QUEUE_IN_PUMA=true
#         - 1.2.3.5
#     proxy:
#       ssl: true
#       host: app.example.com
#     registry:
#       server: ghcr.io
#       username: your-user
#     registry_password: <secret>
#     ssh:
#       user: deploy
#     database:
#       host: rails_saas_kit-db    # Kamal accessory hostname or external IP
#       username: rails_saas_kit
#       password: <secret>
#     accessories:
#       db:
#         host: 1.2.3.6            # host running the Postgres accessory

service: rails_saas_kit

image: <%= kamal.fetch(:image, "rails_saas_kit") %>

servers:
  web:
<% Array(servers.fetch(:web)).each do |host| %>
    - <%= host %>
<% end %>
<% if servers[:job]&.any? %>
  job:
    hosts:
<% servers[:job].each do |host| %>
      - <%= host %>
<% end %>
    cmd: bin/jobs
<% end %>

<% if (proxy = kamal[:proxy]) %>
proxy:
  ssl: <%= proxy.fetch(:ssl, true) %>
  host: <%= proxy.fetch(:host) %>
<% end %>

registry:
  server: <%= registry.fetch(:server, "ghcr.io") %>
<% if registry[:username] %>
  username: <%= registry[:username] %>
  password:
    - KAMAL_REGISTRY_PASSWORD
<% end %>

<% if (ssh = kamal[:ssh]) %>
ssh:
  user: <%= ssh.fetch(:user) %>
<% end %>

env:
  secret:
    - RAILS_MASTER_KEY
<% if kamal.dig(:database, :password) || kamal.dig(:accessories, :db) %>
    - RAILS_SAAS_KIT_DATABASE_PASSWORD
<% end %>
  clear:
    SOLID_QUEUE_IN_PUMA: <%= kamal.fetch(:solid_queue_in_puma, !servers[:job]&.any?) %>
<% if (db_host = kamal.dig(:database, :host)) %>
    DB_HOST: <%= db_host %>
    DB_USERNAME: <%= kamal.dig(:database, :username) || "rails_saas_kit" %>
<% end %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "rails_saas_kit_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

<% if (db_accessory = kamal.dig(:accessories, :db)) %>
accessories:
  db:
    image: postgres:16-alpine
    host: <%= db_accessory.fetch(:host) %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: <%= kamal.dig(:database, :username) || "rails_saas_kit" %>
        POSTGRES_DB: rails_saas_kit_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
<% end %>
