default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database: rails_saas_kit_development
  queue:
    <<: *default
    database: rails_saas_kit_development
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: rails_saas_kit_test

production:
  primary: &primary_production
    <<: *default
    database: rails_saas_kit_production
    username: rails_saas_kit
    password: <%= ENV["RAILS_SAAS_KIT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rails_saas_kit_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_saas_kit_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rails_saas_kit_production_cable
    migrations_paths: db/cable_migrate
